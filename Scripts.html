<script>
// ============================================================
// CUADRE DE CAJA — FRONTEND CONTROLLER
// CON 7 MEJORAS AL MÓDULO DE TAREAS
// ============================================================

// ── STATE ──
const App = {
  token: null,
  user: null,
  currentTab: null,
  theme: 'dark',
  // MEJORA #4: Cache para búsqueda de tareas
  tareasCache: [],
  tareasFiltro: ''
};

// ── THEME ──
function initTheme() {
  const saved = localStorage.getItem('caja_theme') || 'dark';
  App.theme = saved;
  applyTheme(saved, false);
}

function applyTheme(theme, save = true) {
  App.theme = theme;
  if (theme === 'light') {
    document.documentElement.classList.add('light');
  } else {
    document.documentElement.classList.remove('light');
  }
  if (save) localStorage.setItem('caja_theme', theme);
  const btn = document.getElementById('btn-theme-toggle');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
}

function toggleTheme() {
  applyTheme(App.theme === 'dark' ? 'light' : 'dark');
}

// ── INIT ──
window.addEventListener('load', () => {
  initTheme();
  const stored = sessionStorage.getItem('caja_session');
  if (stored) {
    try {
      const s = JSON.parse(stored);
      App.token = s.token;
      App.user = s.user;
      hideSplash();
      renderApp();
      return;
    } catch(e) { sessionStorage.removeItem('caja_session'); }
  }
  setTimeout(hideSplash, 1200);
});

function hideSplash() {
  const splash = document.getElementById('splash');
  const main = document.getElementById('main-container');
  splash.classList.add('hidden');
  setTimeout(() => {
    splash.style.display = 'none';
    main.style.display = 'block';
    if (!App.token) renderLogin();
  }, 500);
}

// ── GAS CALL WRAPPER ──
function call(fn, ...args) {
  function attempt() {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((result) => {
          if (result === null || result === undefined) {
            reject(new Error('__NULL__'));
          } else {
            resolve(result);
          }
        })
        .withFailureHandler((err) => {
          const msg = (err && err.message) ? err.message
            : (typeof err === 'string') ? err
            : 'Error del servidor GAS';
          reject(new Error(msg));
        })
        [fn](...args);
    });
  }

  return attempt().catch((e) => {
    if (e.message === '__NULL__') {
      return new Promise((resolve) => setTimeout(resolve, 1500))
        .then(() => attempt())
        .catch(() => {
          throw new Error('El servidor no respondió. Vuelve a intentar.');
        });
    }
    throw e;
  });
}

// ── RENDER HELPERS ──
function mount(html) {
  document.getElementById('main-container').innerHTML = html;
}

function showAlert(msg, type = 'error', containerId = 'alert-box') {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}

function setLoading(btnId, loading, label = 'Confirmar') {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  btn.disabled = loading;
  btn.innerHTML = loading ? `<span class="spinner"></span>` : label;
}

function formatMoney(n) {
  const num = Number(n) || 0;
  return '$' + Math.abs(num).toFixed(2);
}

function formatMoneyColored(n) {
  const num = Number(n) || 0;
  const cls = num >= 0 ? 'cierre-pos' : 'cierre-neg';
  const sign = num >= 0 ? '+' : '-';
  return `<span class="${cls}">${sign}$${Math.abs(num).toFixed(2)}</span>`;
}

function getDotClass(tipo) {
  const t = (tipo || '').toLowerCase();
  if (t.includes('efect')) return 'dot-efectivo';
  if (t.includes('banco') || t.includes('bank')) return 'dot-banco';
  if (t.includes('venta') || t.includes('app')) return 'dot-venta';
  return 'dot-otros';
}

// ── LOGIN ──
function renderLogin() {
  mount(`
    <div class="login-page">
      <div class="login-card">
        <div class="login-header">
          <div class="login-logo" style="background:#FFE500; border-radius:16px; width:72px; height:72px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px;">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="56" height="56">
              <path d="M30 50 C30 50 42 42 50 30 C58 42 70 50 70 50 C70 50 58 58 50 70 C42 58 30 50 30 50Z" fill="#1A35C5"/>
              <path d="M52 25 L60 25 C72 25 80 36 80 50 C80 64 72 75 60 75 L52 75 Z" fill="none" stroke="#1A35C5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h1 class="login-title">D'TODOEC</h1>
          <p class="login-sub">Sistema de control de caja</p>
        </div>
        <div id="alert-box"></div>
        <div class="form-group">
          <label class="form-label">Usuario</label>
          <input id="inp-user" class="form-input" type="text" placeholder="nombre de usuario" autocomplete="off" autocapitalize="off">
        </div>
        <div class="form-group">
          <label class="form-label">PIN</label>
          <input id="inp-pin" class="form-input" type="password" placeholder="••••" maxlength="8" inputmode="numeric">
        </div>
        <button id="btn-login" class="btn btn-primary btn-full btn-lg" onclick="doLogin()">Ingresar</button>
        <p class="text-muted text-sm" style="text-align:center;margin-top:20px;">
          PIN por defecto admin: <span class="text-accent">1234</span>
        </p>
      </div>
    </div>
  `);
  document.getElementById('inp-pin').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
}

async function doLogin() {
  const user = document.getElementById('inp-user').value.trim();
  const pin  = document.getElementById('inp-pin').value.trim();
  if (!user || !pin) { showAlert('Ingresa usuario y PIN'); return; }
  setLoading('btn-login', true);
  try {
    const res = await call('login', user, pin);
    if (!res.ok) {
      showAlert(res.error || 'Error al ingresar');
      setLoading('btn-login', false, 'Ingresar');
      return;
    }
    App.token = res.token;
    App.user = res.usuario;
    sessionStorage.setItem('caja_session', JSON.stringify({ token: res.token, user: res.usuario }));
    renderApp();
  } catch(e) {
    showAlert('Error de conexión. Intenta de nuevo.');
    setLoading('btn-login', false, 'Ingresar');
  }
}

async function doLogout() {
  try { await call('logout', App.token); } catch(e) {}
  App.token = null;
  App.user = null;
  sessionStorage.removeItem('caja_session');
  renderLogin();
}

// ── CAMBIAR PIN PROPIO ──
function showCambiarPinPropio() {
  showModal('Cambiar mi PIN', `
    <div id="alert-modal"></div>
    <div class="form-group">
      <label class="form-label">PIN actual</label>
      <input id="pin-actual" class="form-input" type="password" placeholder="••••" maxlength="8" inputmode="numeric">
    </div>
    <div class="form-group">
      <label class="form-label">Nuevo PIN</label>
      <input id="pin-nuevo" class="form-input" type="password" placeholder="••••" maxlength="8" inputmode="numeric">
    </div>
    <div class="form-group">
      <label class="form-label">Confirmar nuevo PIN</label>
      <input id="pin-confirmar" class="form-input" type="password" placeholder="••••" maxlength="8" inputmode="numeric">
    </div>
  `, `
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button id="btn-save-pin" class="btn btn-primary" onclick="doGuardarPinPropio()">Guardar PIN</button>
  `);
}

async function doGuardarPinPropio() {
  const actual    = document.getElementById('pin-actual').value.trim();
  const nuevo     = document.getElementById('pin-nuevo').value.trim();
  const confirmar = document.getElementById('pin-confirmar').value.trim();
  if (!actual || !nuevo || !confirmar) { showAlert('Completa todos los campos', 'error', 'alert-modal'); return; }
  if (nuevo !== confirmar) { showAlert('Los PINs nuevos no coinciden', 'error', 'alert-modal'); return; }
  if (nuevo.length < 4) { showAlert('El PIN debe tener al menos 4 dígitos', 'error', 'alert-modal'); return; }
  setLoading('btn-save-pin', true);
  try {
    const check = await call('login', App.user.usuario, actual);
    if (!check.ok) {
      showAlert('El PIN actual es incorrecto', 'error', 'alert-modal');
      setLoading('btn-save-pin', false, 'Guardar PIN');
      return;
    }
    const res = await call('cambiarPin', App.token, App.user.id, nuevo);
    if (!res.ok) throw new Error(res.error);
    closeModal();
    const nb = document.querySelector('.navbar-name');
    if (nb) {
      const orig = nb.textContent;
      nb.textContent = '✅ PIN actualizado';
      nb.style.color = 'var(--accent)';
      setTimeout(() => { nb.textContent = orig; nb.style.color = ''; }, 2500);
    }
  } catch(e) {
    showAlert(e.message, 'error', 'alert-modal');
    setLoading('btn-save-pin', false, 'Guardar PIN');
  }
}

// ============================================================
// VISTA CAJERO
// ============================================================

function _periodoLocal() {
  const now = new Date();
  const dia = now.getDate();
  const mes = String(now.getMonth() + 1).padStart(2, '0');
  const año = now.getFullYear();
  return `${año}-${mes}-${dia <= 15 ? 'Q1' : 'Q2'}`;
}

function _fechaLocal() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}

  const periodo = _periodoLocal();
  const hoyLocal = _fechaLocal();

      <div class="section-header">
        <div>
          <div class="section-title">Historial</div>
          <div class="section-sub">Últimos cierres registrados</div>
        </div>
      </div>
      <div id="historial-cajero"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  `;

  _loadCajeroDatos();
  loadHistorialCajero();
}

async function _loadCajeroDatos() {
  let pingOk = false;
  try {
    const p = await call('ping', App.token);
    pingOk = !!(p && p.ok);
  } catch(e) { pingOk = false; }

  if (!pingOk) {
    _cajeroAccionesError('No hay conexión con el servidor GAS.', 'Verifica que el script esté desplegado correctamente.');
    return;
  }

  let estadoRes = null, recursosRes = null, estadoError = null;
  try { estadoRes = await call('obtenerEstadoHoy', App.token); } catch(e) { estadoError = e.message; }
  try { recursosRes = await call('obtenerRecursosDeUsuario', App.token, App.user.id); } catch(e) {}

  if (!estadoRes || !estadoRes.ok) {
    _cajeroAccionesError('Error al obtener estado de caja', estadoRes?.error || estadoError || 'Error desconocido');
    return;
  }

  const { hoy, periodo, tieneApertura, tieneCierre, ultimosCierres } = estadoRes;
  const recursos = recursosRes?.recursos || [];

  const hoyEl = document.getElementById('cajero-hoy');
  const fechaEl = document.getElementById('cajero-fecha');
  if (hoyEl) hoyEl.textContent = hoy;
  if (fechaEl) fechaEl.textContent = hoy;

  const estadoEl = document.getElementById('cajero-estado');
  if (estadoEl) {
    estadoEl.innerHTML = tieneCierre
      ? `<span class="badge badge-closed">Cerrado</span>`
      : tieneApertura
        ? `<span class="badge badge-open">Caja Abierta</span>`
        : `<span class="badge badge-pending">Sin Apertura</span>`;
  }

  const nRecEl = document.getElementById('cajero-n-recursos');
  if (nRecEl) nRecEl.textContent = recursos.length;

  const accionesEl = document.getElementById('cajero-acciones');
  if (accionesEl) {
    accionesEl.innerHTML = !tieneApertura
      ? renderBtnApertura()
      : !tieneCierre
        ? renderBtnCierre()
        : renderDiaCompleto();
  }

  window._cajeroData = { recursos, ultimosCierres, tieneApertura, hoy };

  try {
    const ganRes = await call('obtenerGananciasAcumuladasUsuario', App.token);
    if (ganRes && ganRes.ok && Array.isArray(ganRes.ganancias)) {
      const total = ganRes.ganancias.reduce((a, g) => a + (g.gananciaAcumulada || 0), 0);
      const ganEl = document.getElementById('cajero-ganancia');
      if (ganEl) {
        ganEl.className = `stat-value ${total >= 0 ? 'accent' : 'danger'}`;
        ganEl.textContent = formatMoney(total);
      }
    }
  } catch(e) {}
}

function _cajeroAccionesError(titulo, detalle) {
  const el = document.getElementById('cajero-acciones');
  if (!el) return;
  el.innerHTML = `
    <div class="card">
      <div class="card-title mb-8">⚠️ ${titulo}</div>
      <p class="text-muted text-sm mb-16">${detalle}</p>
      <button class="btn btn-primary btn-sm" onclick="_loadCajeroDatos()">↻ Reintentar</button>
    </div>
  `;
  const estadoEl = document.getElementById('cajero-estado');
  if (estadoEl) estadoEl.innerHTML = `<span class="badge badge-pending">Sin datos</span>`;
}

function renderBtnApertura() {
  return `
    <div class="card">
      <div class="card-header"><div class="card-title">Apertura de Caja</div></div>
      <p class="text-muted text-sm mb-16">Registra el saldo inicial de cada recurso al comenzar el día.</p>
      <button class="btn btn-primary" onclick="showAperturaForm()">🔓 Registrar Apertura</button>
    </div>
  `;
}

function renderBtnCierre() {
  return `
    <div class="card">
      <div class="card-header"><div class="card-title">Cierre de Caja</div></div>
      <p class="text-muted text-sm mb-16">Registra el saldo final de cada recurso al terminar el día.</p>
      <button class="btn btn-warn" onclick="showCierreForm()">🔒 Registrar Cierre</button>
    </div>
  `;
}

function renderDiaCompleto() {
  return `
    <div class="card">
      <div class="card-header"><div class="card-title">✅ Día completado</div></div>
      <p class="text-muted text-sm">La apertura y el cierre de hoy han sido registrados.</p>
    </div>
  `;
}

async function loadHistorialCajero() {
  try {
    const res = await call('obtenerHistorialUsuario', App.token, 15);
    const el = document.getElementById('historial-cajero');
    if (!el) return;
    if (!res.ok || !res.registros.length) {
      el.innerHTML = `<div class="empty"><div class="empty-icon">📋</div>Sin registros aún</div>`;
      return;
    }
    const rows = res.registros.map(r => `
      <tr>
        <td>${r.fecha}</td>
        <td>${r.recursoNombre}</td>
        <td class="mono">${formatMoney(r.valor)}</td>
        <td><span class="badge badge-closed">${r.periodo}</span></td>
      </tr>
    `).join('');
    el.innerHTML = `
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Fecha</th><th>Recurso</th><th>Cierre</th><th>Periodo</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  } catch(e) {
    const el = document.getElementById('historial-cajero');
    if (el) el.innerHTML = `<div class="alert alert-error">Error cargando historial</div>`;
  }
}

// ── APERTURA MODAL ──
function showAperturaForm() {
  const { recursos, ultimosCierres } = window._cajeroData;
  if (!recursos.length) {
    showAlert('No tienes recursos asignados. Contacta al administrador.', 'warn', 'alert-box-cajero');
    return;
  }
  const inputs = recursos.map(r => {
    const ref = ultimosCierres[r.id];
    const refText = ref ? `Último cierre: ${formatMoney(ref.ultimoValor)} (${ref.ultimaFecha})` : 'Sin registro previo';
    return `
      <div class="resource-row">
        <div>
          <div class="resource-name">
            <span class="resource-type-dot ${getDotClass(r.tipo)}"></span>
            ${r.nombre}
          </div>
          <div class="resource-ref">${refText}</div>
        </div>
        <input class="resource-input" type="number" step="0.01" min="0" placeholder="0.00"
          id="apertura_${r.id}" data-recurso-id="${r.id}" data-recurso-nombre="${r.nombre}">
      </div>
    `;
  }).join('');

  showModal('Apertura de Caja', `
    <p class="text-muted text-sm mb-16">Ingresa el saldo que tienes ahora mismo en cada recurso.</p>
    <div class="resource-grid">${inputs}</div>
    <div id="alert-modal"></div>
  `, `
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button id="btn-confirm-apertura" class="btn btn-primary" onclick="doApertura()">Confirmar Apertura</button>
  `);
}

async function doApertura() {
  const { recursos } = window._cajeroData;
  const valores = [];
  for (const r of recursos) {
    const inp = document.getElementById(`apertura_${r.id}`);
    const val = parseFloat(inp?.value);
    if (isNaN(val) || val < 0) {
      showAlert(`Ingresa un valor válido para: ${r.nombre}`, 'error', 'alert-modal');
      return;
    }
    valores.push({ recursoId: r.id, recursoNombre: r.nombre, valor: val });
  }
  setLoading('btn-confirm-apertura', true);
  try {
    const res = await call('registrarApertura', App.token, valores);
    if (!res.ok) throw new Error(res.error);
    closeModal();
    renderCajeroHome();
  } catch(e) {
    showAlert(e.message, 'error', 'alert-modal');
    setLoading('btn-confirm-apertura', false, 'Confirmar Apertura');
  }
}

// ── CIERRE MODAL ──
async function showCierreForm() {
  const { recursos, ultimosCierres } = window._cajeroData;
  if (!recursos.length) {
    showAlert('No tienes recursos asignados.', 'warn', 'alert-box-cajero');
    return;
  }
  showModal('Cierre de Caja', `
    <div class="loading"><div class="spinner"></div> Cargando datos de apertura...</div>
    <div id="alert-modal"></div>
  `, `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>`);

  const hoy = window._cajeroData.hoy;
  let aperturasMap = {};
  try {
    const histRes = await call('obtenerDetalleRegistros', App.token, { fecha: hoy, tipo: 'apertura' });
    if (histRes && histRes.ok && Array.isArray(histRes.registros)) {
      histRes.registros.forEach(r => { aperturasMap[r.recursoNombre] = Number(r.valor) || 0; });
    }
  } catch(e) { console.warn('No se pudieron cargar aperturas:', e); }

  recursos.forEach(r => {
    if (aperturasMap[r.nombre] === undefined) {
      const ref = ultimosCierres[r.id];
      aperturasMap[r.nombre] = ref ? Number(ref.ultimoValor) || 0 : 0;
    }
  });

  const inputs = recursos.map(r => {
    const valApertura = aperturasMap[r.nombre] ?? 0;
    return `
      <div class="resource-row">
        <div>
          <div class="resource-name">
            <span class="resource-type-dot ${getDotClass(r.tipo)}"></span>
            ${r.nombre}
          </div>
          <div class="resource-ref">Apertura hoy: <strong>${formatMoney(valApertura)}</strong></div>
        </div>
        <input class="resource-input" type="number" step="0.01" min="0" placeholder="0.00"
          id="cierre_${r.id}" data-recurso-id="${r.id}" data-recurso-nombre="${r.nombre}" data-apertura="${valApertura}">
      </div>
    `;
  }).join('');

  const modalEl = document.querySelector('.modal');
  if (!modalEl) return;
  const bodyDiv = modalEl.querySelectorAll('div')[1];
  if (bodyDiv) {
    bodyDiv.innerHTML = `
      <p class="text-muted text-sm mb-16">Ingresa el saldo actual al finalizar el día.</p>
      <div class="resource-grid">${inputs}</div>
      <div id="cierre-preview"></div>
      <div id="alert-modal"></div>
    `;
  }
  const footerEl = document.querySelector('.modal-footer');
  if (footerEl) {
    footerEl.innerHTML = `
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button id="btn-confirm-cierre" class="btn btn-warn" onclick="doCierre()">Confirmar Cierre</button>
    `;
  }
  recursos.forEach(r => {
    const inp = document.getElementById(`cierre_${r.id}`);
    if (inp) inp.addEventListener('input', updateCierrePreview);
  });
}

function updateCierrePreview() {
  const inputs = document.querySelectorAll('[id^="cierre_"]');
  if (!inputs.length) return;
  let totalGanancia = 0, allFilled = true;
  const rows = [];
  inputs.forEach(inp => {
    const apertura = parseFloat(inp.dataset.apertura) || 0;
    const cierre = parseFloat(inp.value);
    if (isNaN(cierre)) { allFilled = false; return; }
    const ganancia = cierre - apertura;
    totalGanancia += ganancia;
    rows.push({ nombre: inp.dataset.recursoNombre, apertura, cierre, ganancia });
  });
  if (!allFilled || !rows.length) {
    document.getElementById('cierre-preview').innerHTML = '';
    return;
  }
  const detalles = rows.map(r => `
    <div class="cierre-row">
      <span class="cierre-label">${r.nombre}</span>
      <span class="cierre-val">${formatMoney(r.apertura)} → ${formatMoney(r.cierre)} &nbsp; ${formatMoneyColored(r.ganancia)}</span>
    </div>
  `).join('');
  const totalClass = totalGanancia >= 0 ? 'cierre-pos' : 'cierre-neg';
  const sign = totalGanancia >= 0 ? '+' : '';
  document.getElementById('cierre-preview').innerHTML = `
    <div class="cierre-result">
      ${detalles}
      <div class="cierre-total">
        <span class="cierre-total-label">Ganancia del día</span>
        <span class="cierre-total-val ${totalClass}">${sign}${formatMoney(totalGanancia)}</span>
      </div>
    </div>
  `;
}

async function doCierre() {
  const inputs = document.querySelectorAll('[id^="cierre_"]');
  const valores = [];
  for (const inp of inputs) {
    const apertura = parseFloat(inp.dataset.apertura) || 0;
    const cierre = parseFloat(inp.value);
    if (isNaN(cierre) || cierre < 0) {
      showAlert(`Ingresa un valor válido para: ${inp.dataset.recursoNombre}`, 'error', 'alert-modal');
      return;
    }
    valores.push({
      recursoId: inp.dataset.recursoId,
      recursoNombre: inp.dataset.recursoNombre,
      valorApertura: apertura,
      valorCierre: cierre
    });
  }
  if (!valores.length) { showAlert('No hay recursos para cerrar', 'error', 'alert-modal'); return; }
  setLoading('btn-confirm-cierre', true);
  try {
    const res = await call('registrarCierre', App.token, valores);
    if (!res) throw new Error('No se recibió respuesta del servidor.');
    if (!res.ok) throw new Error(res.error || 'Error al registrar el cierre');
    closeModal();
    renderCajeroHome();
  } catch(e) {
    showAlert(e.message || 'Error desconocido.', 'error', 'alert-modal');
    setLoading('btn-confirm-cierre', false, 'Confirmar Cierre');
  }
}

function adminTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  ['dashboard','tareas','usuarios','locales','recursos','cierre','historial','egresos','transferencias','deudas'].forEach(t => {
    const el = document.getElementById(`tab-${t}`);
    if (el) el.style.display = 'none';
  });
  const el = document.getElementById(`tab-${tab}`);
  if (el) el.style.display = 'block';
  App.currentTab = tab;

  if (tab === 'tareas' && !el.dataset.loaded) { loadTabTareas(); el.dataset.loaded = '1'; }
  if (tab === 'usuarios' && !el.dataset.loaded) { loadTabUsuarios(); el.dataset.loaded = '1'; }
  if (tab === 'locales' && !el.dataset.loaded) { loadTabLocales(); el.dataset.loaded = '1'; }

  if (tab === 'deudas' && !el.dataset.loaded) { loadTabDeudas(); el.dataset.loaded = '1'; }
}

async function doGuardarPinAdmin(usuarioId, usuarioNombre) {
  const nuevo     = document.getElementById('pin-nuevo-admin').value.trim();
  const confirmar = document.getElementById('pin-confirmar-admin').value.trim();
  if (!nuevo || !confirmar) { showAlert('Completa ambos campos', 'error', 'alert-modal'); return; }
  if (nuevo !== confirmar) { showAlert('Los PINs no coinciden', 'error', 'alert-modal'); return; }
  if (nuevo.length < 4) { showAlert('El PIN debe tener al menos 4 dígitos', 'error', 'alert-modal'); return; }
  setLoading('btn-save-pin-admin', true);
  try {
    const res = await call('cambiarPin', App.token, usuarioId, nuevo);
    if (!res.ok) throw new Error(res.error);
    closeModal();
    showAlert(`✅ PIN de ${usuarioNombre} actualizado correctamente`, 'success', 'alert-usuarios');
  } catch(e) {
    showAlert(e.message, 'error', 'alert-modal');

      if (!res.ok) throw new Error(res.error);
      badge.className = 'badge badge-closed';
      badge.textContent = 'Sin asignar';
      if (cupoRow) cupoRow.style.display = 'none';
      const row = document.getElementById(`asig-row-${recursoId}`);
      row.querySelector('[onclick]').setAttribute('onclick', `toggleAsignacion('${usuarioId}','${recursoId}','${recursoNombre}',false)`);
    } else {
      const res = await call('asignarRecurso', App.token, usuarioId, recursoId);
      if (!res.ok) throw new Error(res.error);
      badge.className = 'badge badge-open';
      badge.textContent = 'Asignado';
      if (cupoRow) cupoRow.style.display = 'flex';
      const row = document.getElementById(`asig-row-${recursoId}`);
      row.querySelector('[onclick]').setAttribute('onclick', `toggleAsignacion('${usuarioId}','${recursoId}','${recursoNombre}',true)`);
    }
  } catch(e) { alert('Error: ' + e.message); }
}

async function guardarCuposAsignados(usuarioId) {
  const inputs = document.querySelectorAll('[id^="cupo-"]');
  const cupos = [];
  inputs.forEach(inp => {
    const cupoRow = document.getElementById(`cupo-row-${inp.dataset.recursoId}`);
    if (cupoRow && cupoRow.style.display !== 'none') {
      const val = parseFloat(inp.value);
      if (!isNaN(val) && val > 0) {
        cupos.push({ recursoId: inp.dataset.recursoId, recursoNombre: inp.dataset.recursoNombre, cupo: val });
      }
    }
  });
  if (!cupos.length) { closeModal(); return; }
  setLoading('btn-guardar-asig', true);
  try {
    const res = await call('registrarCuposIniciales', App.token, usuarioId, cupos);
    if (!res.ok) throw new Error(res.error);
    closeModal();
    showAlert(`✅ Cupos iniciales guardados correctamente`, 'success', 'alert-usuarios');
  } catch(e) {
    showAlert(e.message, 'error', 'alert-modal');
    setLoading('btn-guardar-asig', false, 'Guardar cupos');
  }
}

async function ejecutarCierre() {

  const verificaciones = [];
  for (const inp of inputs) {

    if (isNaN(val) || val < 0) {
      showAlert(`Valor inválido para: ${inp.dataset.recursoNombre}`, 'error', 'alert-cierre');
      return;

    verificaciones.push({
      usuarioId: inp.dataset.usuarioId,
      recursoId: inp.dataset.recursoId,
      recursoNombre: inp.dataset.recursoNombre,
      saldoVerificado: val
    });
  }
  setLoading('btn-ejecutar-cierre', true);
  try {
    const res = await call('ejecutarCierreQuincenal', App.token, verificaciones);
    if (!res.ok) throw new Error(res.error);
    showAlert(`✅ Cierre del periodo completado correctamente`, 'success', 'alert-cierre');
    setLoading('btn-ejecutar-cierre', false, `🔒 Cerrar periodo`);
    delete document.getElementById('tab-cierre').dataset.loaded;
  } catch(e) {
    showAlert(e.message, 'error', 'alert-cierre');
    setLoading('btn-ejecutar-cierre', false, `🔒 Confirmar Cierre`);
  }
}

const ESTADOS_TAREA = {
  cotizacion: { label: 'Cotización', color: '#f5a623' },
  en_proceso: { label: 'En Proceso', color: '#7c6af8' },
  terminado:  { label: 'Terminado',  color: '#00b892' },
  entregado:  { label: 'Entregado',  color: '#2a9d8f' }
};

// MEJORA #7: Helper para calcular alerta de fecha
function getAlertaEntrega(fechaEntrega, estado) {
  if (!fechaEntrega || estado === 'entregado') return null;
  const hoy = new Date();
  hoy.setHours(0,0,0,0);
  const entrega = new Date(fechaEntrega);
  entrega.setHours(0,0,0,0);
  const diffDias = Math.ceil((entrega - hoy) / (1000 * 60 * 60 * 24));
  
  if (diffDias < 0) return { tipo: 'vencida', texto: `Vencida hace ${Math.abs(diffDias)} día(s)`, clase: 'tarea-vencida' };
  if (diffDias === 0) return { tipo: 'hoy', texto: '¡Entrega HOY!', clase: 'tarea-hoy' };
  if (diffDias <= 3) return { tipo: 'proxima', texto: `Faltan ${diffDias} día(s)`, clase: 'tarea-proxima' };
  return null;
}

function filtrarTareasBusqueda() {
  const query = document.getElementById('tareas-busqueda')?.value.toLowerCase().trim() || '';
  App.tareasFiltro = query;
  const el = document.getElementById('tab-tareas');
  if (!query) {
    renderTareasAdmin(el, App.tareasCache);
    return;
  }
  const filtradas = App.tareasCache.filter(t => 
    t.titulo.toLowerCase().includes(query) ||
    t.cliente.toLowerCase().includes(query) ||
    (t.creadoPorNombre || '').toLowerCase().includes(query) ||
    (t.descripcion || '').toLowerCase().includes(query)
  );
  renderTareasAdmin(el, filtradas, true);
}

  const input = document.getElementById('tareas-busqueda');

  App.tareasFiltro = '';
  renderTareasAdmin(document.getElementById('tab-tareas'), App.tareasCache);

  const totalPorEstado = {};

    const tareasCol = tareas.filter(t => t.estado === estado);

      // MEJORA #2: Mostrar creador

             draggable="true"

          <div class="tc-cliente">👤 ${t.cliente}</div>
          ${t.fechaEntrega ? `<div class="tc-fecha">📅 ${t.fechaEntrega}</div>` : ''}
          ${alertaHTML}
          ${creadorHTML}
          <div class="tc-money">

  el.innerHTML = `

      <div>
        <div class="section-title">Gestor de Tareas</div>
        <div class="section-sub">${tareas.length} tareas ${esFiltrado ? '(filtradas)' : 'en total'}</div>

  `;

function reloadTabTareas() {
  delete document.getElementById('tab-tareas').dataset.loaded;
  loadTabTareas();
  document.getElementById('tab-tareas').dataset.loaded = '1';
}

// MEJORA #3: Funciones Drag & Drop
function handleDragStart(e) {
  e.target.classList.add('dragging');
  e.dataTransfer.setData('text/plain', e.target.dataset.tareaId);
  e.dataTransfer.effectAllowed = 'move';
}

function handleDragEnd(e) {
  e.target.classList.remove('dragging');
  document.querySelectorAll('.kanban-col-gs').forEach(col => {
    col.classList.remove('drop-zone-active', 'drop-zone-hover');
  });
}

function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const col = e.currentTarget;
  col.classList.add('drop-zone-active', 'drop-zone-hover');
}

function handleDragLeave(e) {
  e.currentTarget.classList.remove('drop-zone-hover');
}

async function handleDrop(e) {
  e.preventDefault();
  const col = e.currentTarget;
  col.classList.remove('drop-zone-active', 'drop-zone-hover');
  
  const tareaId = e.dataTransfer.getData('text/plain');
  const nuevoEstado = col.dataset.estado;
  
  if (!tareaId || !nuevoEstado) return;
  
  // Actualizar visualmente primero (optimistic update)
  const card = document.querySelector(`[data-tarea-id="${tareaId}"]`);
  if (card) {
    col.appendChild(card);
    card.classList.remove('dragging');
  }
  
  // Llamar al backend
  try {
    const res = await call('moverTarea', App.token, tareaId, nuevoEstado);
    if (!res || !res.ok) {
      // Revertir si falla
      showAlert(res?.error || 'Error al mover tarea', 'error', 'alert-tareas');
      reloadTabTareas();
    } else {
      // Actualizar cache
      const tarea = App.tareasCache.find(t => t.id === tareaId);
      if (tarea) tarea.estado = nuevoEstado;
      // Actualizar contadores
      document.querySelectorAll('.kanban-col-gs').forEach(c => {
        const estado = c.dataset.estado;
        const count = c.querySelectorAll('.task-card-gs').length;
        const countEl = c.querySelector('.kanban-count');
        if (countEl) countEl.textContent = count;
      });
    }
  } catch(e) {
    showAlert(e.message, 'error', 'alert-tareas');
    reloadTabTareas();
  }
}

      ? pagos.map(p => `

    const res = await call('agregarPagoTarea', App.token, tareaId, monto, fecha, notas);

        '<div class="cierre-row"><span class="cierre-label">Precio</span><span class="cierre-val mono accent">' + formatMoney(tarea.precio) + '</span></div>' +

  } catch(e) {
    const b = document.querySelector('.modal div:nth-child(2)');

  }
}

    <div id="alert-modal"></div>
    <div class="stat-card mb-16"><div class="stat-label">Saldo pendiente</div><div class="stat-value danger">${formatMoney(saldoPendiente)}</div></div>
    <div class="form-group"><label class="form-label">Monto del abono ($) *</label><input id="ab-monto" class="form-input" type="number" step="0.01" placeholder="0.00"></div>
    <div class="flex gap-12">
      <div class="form-group" style="flex:1;"><label class="form-label">Fecha</label><input id="ab-fecha" class="form-input" type="date" value="${new Date().toISOString().split('T')[0]}"></div>
      <div class="form-group" style="flex:1;"><label class="form-label">Método</label>
        <select id="ab-metodo" class="form-input"><option value="efectivo">Efectivo</option><option value="transferencia">Transferencia</option><option value="otro">Otro</option></select>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Notas</label><input id="ab-notas" class="form-input" placeholder="Opcional"></div>
  `, `
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button id="btn-ab" class="btn btn-primary" onclick="doAbonarDeuda('${deudaId}')">Registrar Abono</button>
  `);
}

async function doAbonarDeuda(deudaId) {
  const monto=parseFloat(document.getElementById('ab-monto')?.value);
  const fecha=document.getElementById('ab-fecha')?.value;
  const metodo=document.getElementById('ab-metodo')?.value;
  const notas=document.getElementById('ab-notas')?.value.trim();
  if (!monto||monto<=0){showAlert('Monto inválido','error','alert-modal');return;}
  setLoading('btn-ab',true);
  try {
    const res = await call('abonarDeuda', App.token, deudaId, monto, fecha, metodo, notas);
    if (!res||!res.ok) throw new Error(res?.error||'Error');
    closeModal();
    const el=document.getElementById('tab-deudas');
    delete el.dataset.loaded; loadTabDeudas(); el.dataset.loaded='1';
  } catch(e){showAlert(e.message,'error','alert-modal');setLoading('btn-ab',false,'Registrar Abono');}
}

async function showDeudasSaldadas() {
  try {
    const res = await call('obtenerDeudas', App.token, 'saldadas');
    if (!res||!res.ok) throw new Error(res?.error||'Error');
    const rows = res.deudas.map(d=>'<div class="cierre-row"><span><strong>'+d.deudorNombre+'</strong> — '+d.concepto+'</span><span class="mono accent">'+formatMoney(d.montoTotal)+'</span><span class="text-muted text-sm">'+d.fecha+'</span></div>').join('')||'<div class="empty">Sin saldadas</div>';
    showModal('Deudas Saldadas','<div class="cierre-result">'+rows+'</div>','<button class="btn btn-secondary" onclick="closeModal()">Cerrar</button>');
  } catch(e){showAlert(e.message,'error','alert-deudas');}
}

// ============================================================
// MODAL
// ============================================================

function showModal(title, body, footer) {
  const existing = document.getElementById('modal-backdrop');
  if (existing) existing.remove();

  const div = document.createElement('div');
  div.id = 'modal-backdrop';
  div.className = 'modal-backdrop';
  div.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">${title}</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div>${body}</div>
      <div class="modal-footer">${footer}</div>
    </div>
  `;
  div.addEventListener('click', e => { if (e.target === div) closeModal(); });
  document.body.appendChild(div);
}

function closeModal() {
  const el = document.getElementById('modal-backdrop');
  if (el) el.remove();
}
</script>
